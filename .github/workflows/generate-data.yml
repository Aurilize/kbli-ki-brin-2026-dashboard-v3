name: Generate dashboard data
on:
  push:
    paths:
      - "data/input/**"
      - "data/legacy.json"
      - "scripts/generate_data.py"
      - ".github/workflows/generate-data.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pandas openpyxl
      - run: python scripts/generate_data.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "chore: regenerate dashboard data"; git push; fi
